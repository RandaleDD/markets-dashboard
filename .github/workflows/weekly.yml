name: Daily data refresh

on:
  schedule:
    # 06:00 UTC — after US close (previous day) and before Asia opens.
    # Since this is a single daily EOD snapshot across 7 time zones, some
    # regions' "latest" will be their prior session close and some will be
    # more current — that's an inherent tradeoff of one daily run, not a bug.
    - cron: "0 6 * * *"
  workflow_dispatch: {} # allows manual "Run workflow" from the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Run pipeline (live)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }} # optional — fredgraph.csv path doesn't need it
        run: python pipeline.py --mode live

      - name: Commit refreshed data
        run: |
          git config user.name "markets-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data/latest.json
          git diff --staged --quiet || git commit -m "Daily data refresh $(date -u +%Y-%m-%d)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
