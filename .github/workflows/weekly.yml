name: Weekly data refresh

on:
  schedule:
    # Saturday 06:00 UTC. The dashboard stores one observation per completed
    # week -- Friday's close, or the last session before it -- so this runs
    # after every market Marco tracks has closed for the week and before the
    # next one opens. Running on any other day is harmless: the current week is
    # incomplete, so the weekly series simply attach nothing.
    - cron: "0 6 * * 6"
  workflow_dispatch: {} # allows manual "Run workflow" from the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      # The database is committed, so the checkout IS the accumulated history.
      # Without it the run would have no watermark and would re-bootstrap.
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Fail if the database is missing
        # A silent re-bootstrap would pull ~89MB of BoE archives and quietly
        # replace an accumulated store, so this stops rather than guessing.
        run: |
          test -s data/markets.db || {
            echo "::error::data/markets.db is missing. Run bootstrap.py and commit it."
            exit 1
          }

      - name: Run pipeline (ingest -> quality -> export)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }} # optional — fredgraph.csv path doesn't need it
        run: python pipeline.py --mode live

      - name: Commit refreshed data
        run: |
          git config user.name "markets-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data/latest.json data/markets.db
          git diff --staged --quiet || git commit -m "Weekly data refresh $(date -u +%Y-%m-%d)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
