name: Weekly data refresh

on:
  schedule:
    # Saturday 06:00 UTC. The dashboard stores one observation per completed
    # week -- Friday's close, or the last session before it -- so this runs
    # after every market Marco tracks has closed for the week and before the
    # next one opens. Running on any other day is harmless: the current week is
    # incomplete, so the weekly series simply attach nothing.
    - cron: "0 6 * * 6"
  workflow_dispatch: {} # allows manual "Run workflow" from the Actions tab

permissions:
  contents: write # to replace the `data` branch
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      # pipeline.py does the data handling itself, exactly as on the Mac: it
      # downloads the store from the `data` branch, refuses to run if that is
      # impossible (rather than silently re-bootstrapping), ingests, and
      # replaces the `data` branch with a lease so it can never overwrite a
      # run that published in between. It exits non-zero if the publish
      # failed, which stops the deploy below.
      - name: Run pipeline (sync -> ingest -> quality -> export -> publish)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }} # optional — fredgraph.csv path doesn't need it
        run: |
          git config user.name "markets-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          python pipeline.py --mode live --no-verify

      # A push made with GITHUB_TOKEN cannot start another workflow, so
      # pages.yml never sees this run's push; deploy from here instead.
      - run: python stamp_assets.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
