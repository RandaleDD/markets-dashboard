name: Deploy dashboard to Pages

# The repository's Pages setting is "GitHub Actions", so nothing is published
# unless a workflow does it. The site is main's `site/` directory plus the
# `latest.json` on the single-commit `data` branch (see publish.py).
#
# Triggers:
#   - a push to main that touches the site (code),
#   - a push to `data` from the Mac (new data),
#   - by hand.
# A push to `data` runs the COPY of this file that publish.py puts in every
# data commit (GitHub reads push workflows from the pushed commit), so edits
# here reach that trigger on the next publish.
# The Saturday run is not here: it pushes with GITHUB_TOKEN, which GitHub does
# not allow to start another workflow, so weekly.yml deploys for itself.
on:
  push:
    branches: [main, data]
    paths:
      - "site/**"
      - "stamp_assets.py"
      - ".github/workflows/pages.yml"
      - "latest.json" # the data branch's payload
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead of cancelling, so a data refresh
# that lands mid-deploy still gets published rather than being dropped.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # a push to `data` would otherwise check out the data branch
      - name: Add the published data
        run: |
          git fetch --quiet origin data
          git show FETCH_HEAD:latest.json > site/data/latest.json
          python3 stamp_assets.py
      - uses: actions/configure-pages@v5
      - name: Upload the site directory
        uses: actions/upload-pages-artifact@v3
        with:
          # Only site/ is published. The database and the pipeline stay off
          # the public page.
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
